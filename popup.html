<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>TabTime</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list">List</button>
      <button class="tab-btn" data-tab="chart">Weekly Chart</button>
    </div>

    <div id="list-tab" class="tab-content">
      <p id="total-time">Total: 0h 0m 0s</p>
      <div id="time-list"></div>
      <button id="reset-btn">Clear</button>
    </div>

    <div id="chart-tab" class="tab-content" style="display:none;">
      <canvas id="weekly-chart" width="240" height="200"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
